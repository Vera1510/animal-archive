<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#262339"><title>ANIMAL ARCHIVE — 明日を乗せる舟</title>
<meta name="description" content="動物を導き、仲間と方舟を育てる。動物を迎え、鐘を育てて方舟を出航させる、横画面の短編。">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#262339;color:#f4e8c8;font-family:system-ui,sans-serif;overscroll-behavior:none}#stage{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;align-items:center;justify-content:center}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px;background:#262339;text-align:center;z-index:2}small{color:#cea44c;letter-spacing:.16em}h1{font-weight:500;font-size:clamp(32px,7vw,52px);letter-spacing:.09em;line-height:1.1;margin:24px 0}p{font-size:16px;line-height:1.8}progress{width:min(310px,80vw);height:5px;border:0;background:#47594a;accent-color:#cea44c}progress::-webkit-progress-bar{background:#47594a}progress::-webkit-progress-value{background:#cea44c}#error{display:none;max-width:480px;background:#f4e8c8;color:#262339;padding:24px}button{min-height:48px;padding:12px 32px;border:1px solid #cea44c;background:#a64227;color:white;font-size:16px}#dev{position:fixed;right:5px;top:5px;z-index:5;display:none;background:#f4e8c8;color:#262339;padding:8px;font-size:12px}#dev button{font-size:12px;min-height:30px;padding:4px 9px}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(5px) rotate(1deg)}}.ark-loading{animation:drift 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.ark-loading{animation:none}}</style></head><body><main id="stage"><canvas id="unity-canvas" tabindex="0" aria-label="ANIMAL ARCHIVE ゲーム画面。タップまたはマウスで操作します。"></canvas></main>
<section id="loading" aria-live="polite"><small>THE ARK / A SEAT FOR TOMORROW</small><svg class="ark-loading" width="240" height="190" viewBox="0 0 240 190" aria-hidden="true"><path d="M22 126H218L188 166H61Z" fill="#b75c42"/><path d="M110 123V28M110 32L195 109H116Z" fill="#f4e8c8" stroke="#cea44c" stroke-width="3"/><path d="M53 124V101L60 87L72 96H83L95 87V124" fill="#cea44c"/><path d="M5 177Q30 169 55 177T105 177T155 177T215 177" fill="none" stroke="#cea44c" stroke-width="2"/></svg><h1 style="font-size:24px;letter-spacing:.18em">ANIMAL ARCHIVE</h1><p id="loadtext">方舟に、灯りをともしています…</p><progress id="progress" max="1" value="0"></progress><p id="percent">0%</p><small>動物たちを迎える準備中です。</small><div id="error"><p id="errortext"></p><button onclick="location.reload()">もう一度読み込む</button></div></section>
<aside id="dev">開発プレビュー <button onclick="cmd('early')">早期</button><button onclick="cmd('middle')">中期</button><button onclick="cmd('crisis')">逆潮</button><button onclick="cmd('late')">後期</button><button onclick="cmd('boss')">Boss確認</button><button onclick="cmd('pause')">停止</button><button onclick="cmd('reset')">初期化確認</button><details><summary>状態</summary><pre id="state"></pre></details></aside>
<script>
// Development-only audio output meter. This does not record or transmit sound.
if(new URLSearchParams(location.search).get('dev')==='1'){
 const nativeConnect=AudioNode.prototype.connect,meters=new WeakMap();window.archiveAudioMeters=[];
 AudioNode.prototype.connect=function(...args){const r=nativeConnect.apply(this,args);if(args[0]===this.context.destination){let meter=meters.get(this);if(!meter){meter=this.context.createAnalyser();meter.fftSize=1024;meters.set(this,meter);window.archiveAudioMeters.push(meter);}nativeConnect.call(this,meter);}return r;};
 window.archiveAudioRead=()=>window.archiveAudioMeters.map(a=>{const data=new Float32Array(1024);a.getFloatTimeDomainData(data);return {state:a.context.state,rms:Math.sqrt(data.reduce((s,x)=>s+x*x,0)/data.length),peak:Math.max(...data.map(Math.abs))};});
}
const canvas=document.getElementById('unity-canvas'), loading=document.getElementById('loading');let failed=false,disposed=false,devTimer=null,loadTimer=null;
function fail(message){failed=true;document.getElementById('error').style.display='block';document.getElementById('errortext').textContent=message;document.getElementById('loadtext').textContent='読み込みを完了できませんでした';}
if(!canvas.getContext('webgl2'))fail('このブラウザでは WebGL 2 を利用できません。最新の Safari または Chrome で開いてください。');
const script=document.createElement('script');script.src='Build/Web.loader.js';script.onerror=()=>fail('通信を確認し、もう一度読み込んでください。');
script.onload=()=>{if(failed||disposed)return;createUnityInstance(canvas,{dataUrl:'Build/Web.data.unityweb',frameworkUrl:'Build/Web.framework.js.unityweb',codeUrl:'Build/Web.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',autoSyncPersistentDataPath:true,companyName:'Animal Archive Prototype',productName:'ANIMAL ARCHIVE',productVersion:'0.10.2',devicePixelRatio:Math.min(devicePixelRatio||1,2),showBanner:(message,type)=>{if(type==='error')fail('ゲームの起動中に問題が発生しました。再読み込みをお試しください。');console[type==='error'?'error':'warn'](message);}},p=>{document.getElementById('progress').value=p;document.getElementById('percent').textContent=Math.round(p*100)+'%';if(p>.89)document.getElementById('loadtext').textContent='乗船の準備をしています…';}).then(instance=>{if(disposed){instance.Quit().catch(()=>{});return;}clearTimeout(loadTimer);window.unityInstance=instance;instance.SendMessage('ArchiveGame','Visibility',document.hidden?'hidden':'visible');loading.style.display='none';canvas.focus();if(new URLSearchParams(location.search).get('dev')==='1'&&!new URLSearchParams(location.search).has('test')){document.getElementById('dev').style.display='block';devTimer=setInterval(()=>{document.getElementById('state').textContent=JSON.stringify(window.archiveState,null,2)},300);}}).catch(e=>{console.error(e);fail('起動できませんでした。通信と空きメモリを確認し、再読み込みしてください。');});};
if(!failed)document.body.appendChild(script);
function onVisibility(){if(!disposed)window.unityInstance?.SendMessage('ArchiveGame','Visibility',document.hidden?'hidden':'visible');}
document.addEventListener('visibilitychange',onVisibility);
function disposeGame(){
 if(disposed)return;disposed=true;
 clearInterval(devTimer);clearTimeout(loadTimer);
 document.removeEventListener('visibilitychange',onVisibility);
 const instance=window.unityInstance;window.unityInstance=null;
 if(instance){
  try{instance.SendMessage('ArchiveGame','PrepareExit');}catch(_){}
  // Best effort while the document still exists. Closing the document itself
  // terminates its execution even when an asynchronous Quit cannot finish.
  try{Promise.resolve(instance.Quit()).catch(()=>{});}catch(_){}
 }
 window.archiveState=null;
 if(window.archiveAudioMeters){for(const meter of window.archiveAudioMeters){try{meter.disconnect();}catch(_){}}window.archiveAudioMeters=[];}
}
window.addEventListener('pagehide',disposeGame);
// A history-cache restore must not revive a disposed Unity instance.
window.addEventListener('pageshow',event=>{if(event.persisted&&disposed)location.reload();});
function cmd(command){window.unityInstance?.SendMessage('ArchiveGame','DevCommand',command)}
loadTimer=setTimeout(()=>{if(!disposed&&!window.unityInstance&&!failed)document.getElementById('loadtext').textContent='読み込みを続けています。通信状況により時間がかかります。';},25000);
</script></body></html>
